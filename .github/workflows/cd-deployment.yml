name: CD - Deploy to EKS

# Se activa con push a la rama deploy 
on:
  push:
    branches:
      - deploy
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: retail-microservices-cluster
  ECR_REPO_FRONT: ecr-front-despacho
  ECR_REPO_DESPACHOS: ecr-back-despachos
  ECR_REPO_VENTAS: ecr-back-ventas

jobs:
  # --------------------------------------------------------
  # JOB 1: Build y Push de Frontend a ECR
  # --------------------------------------------------------
  build-push-front:
    name: Build & Push Frontend to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Obtener AWS Account ID
        run: |
          echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV

      - name: Construir URL de ECR Front
        run: |
          echo "FRONT_ECR=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO_FRONT}" >> $GITHUB_ENV

      - name: Build imagen Frontend
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t $FRONT_ECR:${{ github.sha }} \
            -t $FRONT_ECR:latest \
            ./front_despacho \
            --load

      - name: Push imagen Frontend a ECR
        run: |
          docker push $FRONT_ECR:${{ github.sha }}
          docker push $FRONT_ECR:latest

  # --------------------------------------------------------
  # JOB 2: Build y Push de Backend Despachos a ECR
  # --------------------------------------------------------
  build-push-despachos:
    name: Build & Push Backend Despachos to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Obtener AWS Account ID
        run: |
          echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV

      - name: Construir URL de ECR Despachos
        run: |
          echo "DESPACHOS_ECR=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO_DESPACHOS}" >> $GITHUB_ENV

      - name: Build imagen Backend Despachos
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t $DESPACHOS_ECR:${{ github.sha }} \
            -t $DESPACHOS_ECR:latest \
            ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO \
            --load

      - name: Push imagen Backend Despachos a ECR
        run: |
          docker push $DESPACHOS_ECR:${{ github.sha }}
          docker push $DESPACHOS_ECR:latest

  # --------------------------------------------------------
  # JOB 3: Build y Push de Backend Ventas a ECR
  # --------------------------------------------------------
  build-push-ventas:
    name: Build & Push Backend Ventas to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Obtener AWS Account ID
        run: |
          echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV

      - name: Construir URL de ECR Ventas
        run: |
          echo "VENTAS_ECR=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO_VENTAS}" >> $GITHUB_ENV

      - name: Build imagen Backend Ventas
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t $VENTAS_ECR:${{ github.sha }} \
            -t $VENTAS_ECR:latest \
            ./back-Ventas_SpringBoot/Springboot-API-REST \
            --load

      - name: Push imagen Backend Ventas a ECR
        run: |
          docker push $VENTAS_ECR:${{ github.sha }}
          docker push $VENTAS_ECR:latest

  # --------------------------------------------------------
  # JOB 4: Deploy al clúster EKS
  # --------------------------------------------------------
  deploy-to-eks:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: [build-push-front, build-push-despachos, build-push-ventas]

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Obtener AWS Account ID
        run: |
          echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV

      - name: Construir URLs de ECR
        run: |
          echo "FRONT_ECR=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO_FRONT}" >> $GITHUB_ENV
          echo "DESPACHOS_ECR=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO_DESPACHOS}" >> $GITHUB_ENV
          echo "VENTAS_ECR=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO_VENTAS}" >> $GITHUB_ENV

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4

      - name: Conectar al clúster EKS
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $CLUSTER_NAME

      # Aplicar todos los manifiestos (Secret, PVC, Deployments, Services, HPA)
      - name: Aplicar manifiestos de Kubernetes
        run: |
          kubectl apply -f infra/k8s/

      # Actualizar las imágenes en los Deployments con el SHA del commit
      - name: Actualizar imagen del Frontend
        run: |
          kubectl set image deployment/front-despacho \
            front-despacho=$FRONT_ECR:${{ github.sha }}

      - name: Actualizar imagen del Backend Despachos
        run: |
          kubectl set image deployment/back-despachos \
            back-despachos=$DESPACHOS_ECR:${{ github.sha }}

      - name: Actualizar imagen del Backend Ventas
        run: |
          kubectl set image deployment/back-ventas \
            back-ventas=$VENTAS_ECR:${{ github.sha }}

      # Esperar a que los pods estén corriendo
      - name: Esperar rollout del Frontend
        run: kubectl rollout status deployment/front-despacho --timeout=300s

      - name: Esperar rollout del Backend Despachos
        run: kubectl rollout status deployment/back-despachos --timeout=300s

      - name: Esperar rollout del Backend Ventas
        run: kubectl rollout status deployment/back-ventas --timeout=300s

      # Verificar que todo esté corriendo
      - name: Verificar pods en ejecución
        run: |
          echo "=== PODS ==="
          kubectl get pods -o wide
          echo "=== SERVICES ==="
          kubectl get services
          echo "=== HPA ==="
          kubectl get hpa

      # Generar Resumen del Despliegue en GitHub Actions
      - name: Generar Resumen del Despliegue
        run: |
          DNS_FRONTEND=$(kubectl get service front-despacho -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "### 🚀 ¡Despliegue Exitoso en AWS EKS!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 🌐 Acceso al Frontend (DNS Público)" >> $GITHUB_STEP_SUMMARY
          echo "El balanceador de carga está activo en la siguiente dirección:" >> $GITHUB_STEP_SUMMARY
          echo "[http://$DNS_FRONTEND](http://$DNS_FRONTEND)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 🔧 Configurar Consola Local" >> $GITHUB_STEP_SUMMARY
          echo "Para conectarte a este clúster EKS desde tu terminal local y controlarlo, ejecuta:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "aws eks update-kubeconfig --region us-east-1 --name retail-microservices-cluster" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 🔍 Comandos de Verificación" >> $GITHUB_STEP_SUMMARY
          echo "1. **Verificar el estado de todos los recursos (Pods, Services, Deployments):**" >> $GITHUB_STEP_SUMMARY
          echo "   \`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "   kubectl get all" >> $GITHUB_STEP_SUMMARY
          echo "   \`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "   *(Deberías ver los pods de mysql, front-despacho y los dos backends en estado 'Running')*" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "2. **Monitorear los autoescaladores configurados (HPA):**" >> $GITHUB_STEP_SUMMARY
          echo "   \`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "   kubectl get hpa" >> $GITHUB_STEP_SUMMARY
          echo "   \`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "3. **Obtener la dirección URL pública de acceso a tu Frontend:**" >> $GITHUB_STEP_SUMMARY
          echo "   \`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "   kubectl get service front-despacho" >> $GITHUB_STEP_SUMMARY
          echo "   \`\`\`" >> $GITHUB_STEP_SUMMARY
