name: CD - Deploy to EKS

# Se activa con push a la rama deploy 
on:
  push:
    branches:
      - deploy
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: retail-microservices-cluster
  ECR_REPO_FRONT: ecr-front-despacho
  ECR_REPO_DESPACHOS: ecr-back-despachos
  ECR_REPO_VENTAS: ecr-back-ventas

jobs:
  # --------------------------------------------------------
  # JOB 0: Ejecución de Pruebas Unitarias
  # --------------------------------------------------------
  run-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Ejecutar pruebas Backend Despachos
        working-directory: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
        run: |
          chmod +x mvnw
          ./mvnw test

      - name: Ejecutar pruebas Backend Ventas
        working-directory: ./back-Ventas_SpringBoot/Springboot-API-REST
        run: |
          chmod +x mvnw
          ./mvnw test

  # --------------------------------------------------------
  # JOB 1: Build y Push de Frontend a ECR
  # --------------------------------------------------------
  build-push-front:
    name: Build & Push Frontend to ECR
    runs-on: ubuntu-latest
    needs: run-tests

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Obtener AWS Account ID
        run: |
          echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV

      - name: Construir URL de ECR Front
        run: |
          echo "FRONT_ECR=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO_FRONT}" >> $GITHUB_ENV

      - name: Build imagen Frontend
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t $FRONT_ECR:${{ github.sha }} \
            -t $FRONT_ECR:latest \
            ./front_despacho \
            --load

      - name: Push imagen Frontend a ECR
        run: |
          docker push $FRONT_ECR:${{ github.sha }}
          docker push $FRONT_ECR:latest

  # --------------------------------------------------------
  # JOB 2: Build y Push de Backend Despachos a ECR
  # --------------------------------------------------------
  build-push-despachos:
    name: Build & Push Backend Despachos to ECR
    runs-on: ubuntu-latest
    needs: run-tests

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Obtener AWS Account ID
        run: |
          echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV

      - name: Construir URL de ECR Despachos
        run: |
          echo "DESPACHOS_ECR=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO_DESPACHOS}" >> $GITHUB_ENV

      - name: Build imagen Backend Despachos
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t $DESPACHOS_ECR:${{ github.sha }} \
            -t $DESPACHOS_ECR:latest \
            ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO \
            --load

      - name: Push imagen Backend Despachos a ECR
        run: |
          docker push $DESPACHOS_ECR:${{ github.sha }}
          docker push $DESPACHOS_ECR:latest

  # --------------------------------------------------------
  # JOB 3: Build y Push de Backend Ventas a ECR
  # --------------------------------------------------------
  build-push-ventas:
    name: Build & Push Backend Ventas to ECR
    runs-on: ubuntu-latest
    needs: run-tests

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Obtener AWS Account ID
        run: |
          echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV

      - name: Construir URL de ECR Ventas
        run: |
          echo "VENTAS_ECR=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO_VENTAS}" >> $GITHUB_ENV

      - name: Build imagen Backend Ventas
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t $VENTAS_ECR:${{ github.sha }} \
            -t $VENTAS_ECR:latest \
            ./back-Ventas_SpringBoot/Springboot-API-REST \
            --load

      - name: Push imagen Backend Ventas a ECR
        run: |
          docker push $VENTAS_ECR:${{ github.sha }}
          docker push $VENTAS_ECR:latest

  # --------------------------------------------------------
  # JOB 4: Deploy al clúster EKS
  # --------------------------------------------------------
  deploy-to-eks:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: [build-push-front, build-push-despachos, build-push-ventas]

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Obtener AWS Account ID
        run: |
          echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV

      - name: Construir URLs de ECR
        run: |
          echo "FRONT_ECR=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO_FRONT}" >> $GITHUB_ENV
          echo "DESPACHOS_ECR=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO_DESPACHOS}" >> $GITHUB_ENV
          echo "VENTAS_ECR=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO_VENTAS}" >> $GITHUB_ENV

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4

      - name: Conectar al clúster EKS
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $CLUSTER_NAME

      # Aplicar todos los manifiestos (Secret, PVC, Deployments, Services, HPA)
      - name: Aplicar manifiestos de Kubernetes
        run: |
          kubectl apply -f infra/k8s/

      # Actualizar las imágenes en los Deployments con el SHA del commit
      - name: Actualizar imagen del Frontend
        run: |
          kubectl set image deployment/front-despacho \
            front-despacho=$FRONT_ECR:${{ github.sha }}

      - name: Actualizar imagen del Backend Despachos
        run: |
          kubectl set image deployment/back-despachos \
            back-despachos=$DESPACHOS_ECR:${{ github.sha }}

      - name: Actualizar imagen del Backend Ventas
        run: |
          kubectl set image deployment/back-ventas \
            back-ventas=$VENTAS_ECR:${{ github.sha }}

      # Esperar a que los pods estén corriendo en paralelo
      - name: Esperar rollouts en paralelo
        run: |
          echo "Iniciando monitoreo de rollouts en paralelo..."
          kubectl rollout status deployment/front-despacho --timeout=300s &
          PID_FRONT=$!
          kubectl rollout status deployment/back-despachos --timeout=300s &
          PID_DESPACHOS=$!
          kubectl rollout status deployment/back-ventas --timeout=300s &
          PID_VENTAS=$!
          
          # Esperar a cada uno y capturar su estado de salida
          wait $PID_FRONT
          STATUS_FRONT=$?
          wait $PID_DESPACHOS
          STATUS_DESPACHOS=$?
          wait $PID_VENTAS
          STATUS_VENTAS=$?
          
          echo "Resultados del despliegue:"
          echo "Frontend rollout status: $STATUS_FRONT"
          echo "Backend Despachos rollout status: $STATUS_DESPACHOS"
          echo "Backend Ventas rollout status: $STATUS_VENTAS"
          
          if [ $STATUS_FRONT -ne 0 ] || [ $STATUS_DESPACHOS -ne 0 ] || [ $STATUS_VENTAS -ne 0 ]; then
            echo "Error: Uno o más despliegues de microservicios fallaron."
            exit 1
          fi
          echo "¡Todos los despliegues están listos y en ejecución!"

      # Verificar que todo esté corriendo
      - name: Verificar pods en ejecución
        run: |
          echo "=== PODS ==="
          kubectl get pods -o wide
          echo "=== SERVICES ==="
          kubectl get services
          echo "=== HPA ==="
          kubectl get hpa

      # Mostrar instrucciones finales
      - name: Instrucciones de Conexión
        run: |
          echo "=========================================================================================="
          echo "🚀 ¡DESPLIEGUE EXITOSO EN AWS EKS!"
          echo "=========================================================================================="
          echo "🔧 Para conectarte desde tu consola local y verificar:"
          echo "aws eks update-kubeconfig --region us-east-1 --name retail-microservices-cluster"
          echo "=========================================================================================="
          echo "🔍 Comandos rápidos para verificar:"
          echo "kubectl get all"
          echo "kubectl get hpa"
          echo "=========================================================================================="

      # Obtener URL pública de acceso al Frontend
      - name: Obtener URL y Detalles del Frontend
        run: kubectl get service front-despacho
