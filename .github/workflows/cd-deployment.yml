name: CD - Deploy to EKS

# Se activa con push a la rama deploy 
on:
  push:
    branches:
      - deploy
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: retail-microservices-cluster
  ECR_REPO_FRONT: ecr-front-despacho
  ECR_REPO_DESPACHOS: ecr-back-despachos
  ECR_REPO_VENTAS: ecr-back-ventas

jobs:
  # --------------------------------------------------------
  # JOB 1: Build y Push de imágenes a ECR
  # --------------------------------------------------------
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Obtener AWS Account ID
        run: |
          echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV

      - name: Construir URLs de los repositorios ECR
        run: |
          echo "FRONT_ECR=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO_FRONT}" >> $GITHUB_ENV
          echo "DESPACHOS_ECR=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO_DESPACHOS}" >> $GITHUB_ENV
          echo "VENTAS_ECR=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO_VENTAS}" >> $GITHUB_ENV

      # BUILD + PUSH FRONTEND
      - name: Build imagen Frontend
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t $FRONT_ECR:${{ github.sha }} \
            -t $FRONT_ECR:latest \
            ./front_despacho \
            --load

      - name: Push imagen Frontend a ECR
        run: |
          docker push $FRONT_ECR:${{ github.sha }}
          docker push $FRONT_ECR:latest

      # BUILD + PUSH BACKEND DESPACHOS
      - name: Build imagen Backend Despachos
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t $DESPACHOS_ECR:${{ github.sha }} \
            -t $DESPACHOS_ECR:latest \
            ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO \
            --load

      - name: Push imagen Backend Despachos a ECR
        run: |
          docker push $DESPACHOS_ECR:${{ github.sha }}
          docker push $DESPACHOS_ECR:latest

      # BUILD + PUSH BACKEND VENTAS
      - name: Build imagen Backend Ventas
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t $VENTAS_ECR:${{ github.sha }} \
            -t $VENTAS_ECR:latest \
            ./back-Ventas_SpringBoot/Springboot-API-REST \
            --load

      - name: Push imagen Backend Ventas a ECR
        run: |
          docker push $VENTAS_ECR:${{ github.sha }}
          docker push $VENTAS_ECR:latest

  # --------------------------------------------------------
  # JOB 2: Deploy al clúster EKS
  # --------------------------------------------------------
  deploy-to-eks:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push   # espera que Job 1 termine exitosamente

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Obtener AWS Account ID
        run: |
          echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV

      - name: Construir URLs de ECR
        run: |
          echo "FRONT_ECR=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO_FRONT}" >> $GITHUB_ENV
          echo "DESPACHOS_ECR=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO_DESPACHOS}" >> $GITHUB_ENV
          echo "VENTAS_ECR=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO_VENTAS}" >> $GITHUB_ENV

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4

      - name: Conectar al clúster EKS
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $CLUSTER_NAME

      # Aplicar todos los manifiestos (Secret, PVC, Deployments, Services, HPA)
      - name: Aplicar manifiestos de Kubernetes
        run: |
          kubectl apply -f infra/k8s/

      # Actualizar las imágenes en los Deployments con el SHA del commit
      - name: Actualizar imagen del Frontend
        run: |
          kubectl set image deployment/front-despacho \
            front-despacho=$FRONT_ECR:${{ github.sha }}

      - name: Actualizar imagen del Backend Despachos
        run: |
          kubectl set image deployment/back-despachos \
            back-despachos=$DESPACHOS_ECR:${{ github.sha }}

      - name: Actualizar imagen del Backend Ventas
        run: |
          kubectl set image deployment/back-ventas \
            back-ventas=$VENTAS_ECR:${{ github.sha }}

      # Esperar a que los pods estén corriendo
      - name: Esperar rollout del Frontend
        run: kubectl rollout status deployment/front-despacho --timeout=300s

      - name: Esperar rollout del Backend Despachos
        run: kubectl rollout status deployment/back-despachos --timeout=300s

      - name: Esperar rollout del Backend Ventas
        run: kubectl rollout status deployment/back-ventas --timeout=300s

      # Verificar que todo esté corriendo
      - name: Verificar pods en ejecución
        run: |
          echo "=== PODS ==="
          kubectl get pods -o wide
          echo "=== SERVICES ==="
          kubectl get services
          echo "=== HPA ==="
          kubectl get hpa

      # Mostrar la URL pública del Frontend
      - name: Obtener URL pública del Frontend
        run: |
          echo "=== URL PUBLICA DEL FRONTEND ==="
          kubectl get service front-despacho \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
