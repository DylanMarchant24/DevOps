# ============================================================
# FRONTEND DESPACHO - Kubernetes Manifests
# React/Vite - Puerto 80 (nginx)
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-despacho
spec:
  replicas: 2
  selector:
    matchLabels:
      app: front-despacho
  template:
    metadata:
      labels:
        app: front-despacho
    spec:
      containers:
        - name: front-despacho
          # La imagen real se inyecta por kubectl set image en el pipeline
          image: front-despacho:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

---
# Service LoadBalancer: expone el frontend públicamente
# AWS asigna automáticamente un Network Load Balancer externo
apiVersion: v1
kind: Service
metadata:
  name: front-despacho
spec:
  selector:
    app: front-despacho
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer
